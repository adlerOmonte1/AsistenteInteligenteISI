components:
  schemas:
    CargaDocumento:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        proceso:
          type: integer
        archivo:
          type: string
          format: uri
          writeOnly: true
        nombre_original:
          type: string
          readOnly: true
        estado:
          allOf:
          - $ref: '#/components/schemas/CargaDocumentoEstadoEnum'
          readOnly: true
        mensaje:
          type: string
          readOnly: true
        fichas_propuestas:
          type: array
          items:
            $ref: '#/components/schemas/FichaLista'
          readOnly: true
        creada:
          type: string
          format: date-time
          readOnly: true
      required:
      - archivo
      - creada
      - estado
      - fichas_propuestas
      - id
      - mensaje
      - nombre_original
      - proceso
    CargaDocumentoEstadoEnum:
      enum:
      - procesando
      - completada
      - error
      type: string
      description: |-
        * `procesando` - Procesando
        * `completada` - Completada
        * `error` - Error
    Caso:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        proceso_clave:
          type: string
          readOnly: true
        codigo:
          type: string
          maxLength: 40
        pregunta:
          type: string
        intent_esperado:
          type: string
          maxLength: 80
        ficha_esperada:
          type: string
          maxLength: 30
        respuesta_clave:
          type: string
          description: Dato que la respuesta debe contener.
        tipo:
          type: string
          description: normal, parafraseo, fuera_de_tema...
          maxLength: 30
        activo:
          type: boolean
        proceso:
          type: integer
      required:
      - codigo
      - id
      - pregunta
      - proceso
      - proceso_clave
    Configuracion:
      type: object
      properties:
        proveedor_llm:
          type: string
          readOnly: true
        modelo_llm:
          type: string
          readOnly: true
        proveedor_embeddings:
          type: string
          readOnly: true
        umbral_determinista:
          type: number
          format: double
        umbral_desambiguacion:
          type: number
          format: double
        intentos_antes_de_derivar:
          type: integer
          maximum: 32767
          minimum: 0
        limite_usd_mes:
          type: string
          format: decimal
          pattern: ^-?\d{0,6}(?:\.\d{0,2})?$
        llm_habilitado:
          type: boolean
          description: Apagarlo deja solo la vía determinista y la derivación.
        mensaje_bienvenida:
          type: string
        contacto_derivacion:
          type: string
          description: Texto que se muestra al derivar a una persona. Solo datos oficiales.
        aviso_legal:
          type: string
        actualizado:
          type: string
          format: date-time
          readOnly: true
      required:
      - actualizado
      - modelo_llm
      - proveedor_embeddings
      - proveedor_llm
    Consulta:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        proceso_nombre:
          type: string
          readOnly: true
        sesion:
          type: string
          format: uuid
        pregunta:
          type: string
        respuesta:
          type: string
        intent:
          type: string
          maxLength: 80
        confianza:
          type: number
          format: double
        via:
          $ref: '#/components/schemas/ViaEnum'
        fichas_citadas: {}
        derivada:
          type: boolean
        validacion_fallida:
          type: boolean
        datos_no_respaldados: {}
        motivo:
          type: string
          description: Por qué se tomó la vía (p. ej. limite_de_gasto).
          maxLength: 40
        tokens_entrada:
          type: integer
          maximum: 2147483647
          minimum: 0
        tokens_salida:
          type: integer
          maximum: 2147483647
          minimum: 0
        tokens_embedding:
          type: integer
          maximum: 2147483647
          minimum: 0

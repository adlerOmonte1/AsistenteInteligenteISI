openapi: 3.0.3
info:
  title: API del Asistente Virtual UDH
  version: 1.0.0
  description: Consultas de trámites del P.A. de Ingeniería de Sistemas e Informática.
paths:
  /api/v1/admin/documentos/:
    get:
      operationId: admin_documentos_list
      description: Biblioteca normativa del portal.
      parameters:
      - name: page
        required: false
        in: query
        description: Un número de página dentro del conjunto de resultados paginado.
        schema:
          type: integer
      - name: tamano
        required: false
        in: query
        description: Número de resultados a devolver por página.
        schema:
          type: integer
      tags:
      - admin
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedDocumentoList'
          description: ''
    post:
      operationId: admin_documentos_create
      description: Biblioteca normativa del portal.
      tags:
      - admin
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Documento'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Documento'
          application/json:
            schema:
              $ref: '#/components/schemas/Documento'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Documento'
          description: ''
  /api/v1/admin/documentos/{id}/:
    get:
      operationId: admin_documentos_retrieve
      description: Biblioteca normativa del portal.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: Un valor de entero único que identifique este documento.
        required: true
      tags:
      - admin
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Documento'
          description: ''
    put:
      operationId: admin_documentos_update
      description: Biblioteca normativa del portal.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: Un valor de entero único que identifique este documento.
        required: true
      tags:
      - admin
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Documento'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Documento'
          application/json:
            schema:
              $ref: '#/components/schemas/Documento'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Documento'
          description: ''
    patch:
      operationId: admin_documentos_partial_update
      description: Biblioteca normativa del portal.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: Un valor de entero único que identifique este documento.
        required: true
      tags:
      - admin
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedDocumento'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedDocumento'
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedDocumento'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Documento'
          description: ''
    delete:
      operationId: admin_documentos_destroy
      description: Biblioteca normativa del portal.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: Un valor de entero único que identifique este documento.
        required: true
      tags:
      - admin
      security:
      - jwtAuth: []
      responses:
        '204':
          description: No response body

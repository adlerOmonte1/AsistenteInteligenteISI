name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  arquitectura:
    name: Arquitectura y conocimiento
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Modelo C4 al día con el código
        run: python scripts/validar_c4.py
      - name: Sintaxis del workspace.dsl
        # structurizr/cli está descontinuada y ya no valida; la imagen consolidada sí.
        run: |
          docker run --rm -v "$PWD/docs/03-arquitectura/modelo-c4:/w" structurizr/structurizr validate -workspace /w/workspace.dsl
      - name: Contrato de fichas (informativo)
        # Varias carpetas de la Fase 2 aún no cumplen el contrato; el reporte queda en el log
        # sin bloquear el PR. Quitar continue-on-error cuando todas cumplan
        # (docs/02-base-conocimiento/estado_conocimiento.md).
        continue-on-error: true
        run: python knowledge-base/herramientas/validar_contrato.py knowledge-base/procesos

  backend:
    name: Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      db:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: asistente
          POSTGRES_USER: asistente
          POSTGRES_PASSWORD: asistente
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U asistente" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://asistente:asistente@localhost:5432/asistente
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements/*.txt
      - run: pip install -r requirements/dev.txt
      - name: Estilo
        run: |
          ruff check .
          ruff format --check .
      - name: Configuración y migraciones
        run: |
          python manage.py check
          python manage.py makemigrations --check --dry-run
      - name: Pruebas
        run: pytest --create-db
      - name: Importación de knowledge-base (sin errores)
        run: |
          python manage.py migrate --noinput
          python manage.py importar_conocimiento --dry-run

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run format:check
      - run: npm run build
      - run: npm test

  imagenes:
    name: Imágenes Docker
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f backend/Dockerfile -t asistente-api .
      - run: docker build -f infra/nginx/Dockerfile -t asistente-web .

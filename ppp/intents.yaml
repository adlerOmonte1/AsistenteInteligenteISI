# Desvíos a intents de otros procesos (no se definen aquí)
desvios:
  - si_detecta: ["ya trabajo", "experiencia laboral", "convalidar prácticas", "convalidar ppp", "trabajo hace más de un año"]
    redirigir_a: CPP_*            # Integrante E
  - si_detecta: ["convalidar cursos", "traslado interno", "traslado externo"]
    redirigir_a: TRA_*            # Integrante F
  - si_detecta: ["trámite de bachiller", "grado de bachiller"]
    redirigir_a: BAC_*            # Integrante E
  - si_fallan: 2 intentos
    redirigir_a: GEN_derivar_humano   # Integrante F

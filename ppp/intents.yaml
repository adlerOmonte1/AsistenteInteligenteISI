# Proceso D — Prácticas Pre Profesionales (PPP), Plan 2021
# Prefijo: PPP_
# Las referencias a GEN_*, CPP_*, TRA_* y BAC_* se resuelven en las carpetas de otros integrantes.

entidades:
  - nombre: etapa
    valores:
      - valor: carta_presentacion
        ficha: PPP_E01
        sinonimos: [etapa 1, primera etapa, carta de presentación, carta, presentación, carta de la facultad]
      - valor: plan
        ficha: PPP_E02
        sinonimos: [etapa 2, segunda etapa, plan, plan de prácticas, plan de ppp, aprobación del plan]
      - valor: ejecucion
        ficha: PPP_E03
        sinonimos: [etapa 3, tercera etapa, ejecución, durante las prácticas, horas, asistencia]
      - valor: informe_final
        ficha: PPP_E04
        sinonimos: [etapa 4, cuarta etapa, última etapa, informe final, informe, sustentación, expediente final]

  - nombre: anexo
    valores:
      - {valor: "02", sinonimos: [anexo 2, anexo 02, carta de compromiso], ficha: PPP_T02}
      - {valor: "03", sinonimos: [anexo 3, anexo 03, carta de aceptación], ficha: PPP_T02}
      - {valor: "04", sinonimos: [anexo 4, anexo 04, formato del plan], ficha: PPP_T02}
      - {valor: "05", sinonimos: [anexo 5, anexo 05, estructura del informe], ficha: PPP_T02}
      - {valor: "06", sinonimos: [anexo 6, anexo 06, ficha de evaluación, evaluación del jefe], ficha: PPP_T02}
      - {valor: "07", sinonimos: [anexo 7, anexo 07, ficha de supervisión], ficha: PPP_T02}
      - {valor: "10", sinonimos: [anexo 10, ficha de avances], ficha: PPP_T02}

intents:

  - intent: PPP_info_general
    descripcion: Qué son las PPP, cuántas horas son, si son obligatorias y cuáles son sus etapas
    entidades: []
    ficha_relacionada: PPP_E00
    si_falta_entidad: null
    ejemplos:
      - "qué son las prácticas pre profesionales"
      - "cómo funcionan las prácticas"
      - "cuántas horas de prácticas tengo que hacer"
      - "cuáles son las etapas de las ppp"
      - "las prácticas son obligatorias"
      - "me puedo exonerar de las prácticas"
      - "explíqueme el proceso de prácticas"
      - "quiero hacer mis prácticas, por dónde empiezo"
      - "info sobre ppp"
      - "cuánto duran las prácticas pre profesionales"
      - "las ppp son requisito para el bachiller"
      - "cuántas etapas tienen las practicas"
      - "qué es la ppp"
      - "necesito información de prácticas pre profesionales plan 2021"
      - "son 600 horas de practicas?"


    ficha_relacionada: PPP_E00
    si_falta_entidad: null
    ejemplos:
      - "desde qué ciclo puedo hacer prácticas"
      - "qué necesito para empezar mis prácticas"
      - "puedo hacer prácticas si estoy en séptimo ciclo"
      - "en qué áreas puedo hacer mis prácticas"
      - "puedo practicar en una empresa que no es de sistemas"
      - "quién tiene que supervisarme en la empresa"
      - "puedo hacer prácticas en una entidad pública"
      - "mis prácticas pueden cruzarse con mi horario de clases"
      - "requisitos para iniciar ppp"
      - "me falta un curso de octavo, puedo empezar las prácticas"
      - "puedo hacer prácticas en soporte técnico"
      - "la empresa tiene que tener un ingeniero de sistemas"
      - "puedo hacer prácticas en redes"
      - "valen las prácticas en una municipalidad"
      - "qué condiciones piden para las ppp"

  - intent: PPP_diagnostico_etapa
    descripcion: El estudiante no sabe en qué etapa está o qué le toca hacer ahora
    entidades: []
    ficha_relacionada: PPP_E01 a PPP_E04 según el diagnóstico
    si_falta_entidad: null   # el flujo de diagnóstico hace las preguntas (ver flujo.md)
    ejemplos:
      - "en qué etapa de prácticas estoy"
      - "ya tengo la carta de aceptación, qué sigue"
      - "ya me llegó la carta de presentación, ahora qué hago"
      - "me aprobaron el plan, qué sigue"
      - "ya terminé mis 600 horas, qué hago ahora"
      - "no sé qué me toca hacer en mis prácticas"
      - "ya empecé a practicar, qué tengo que presentar"
      - "estoy practicando y no he hecho ningún trámite"
      - "qué me falta para terminar las prácticas"
      - "cuál es mi siguiente paso en ppp"
      - "ya tengo empresa para practicar, qué hago"
      - "acabo de empezar en la empresa, qué trámite hago"
      - "ya tengo asesor supervisor, ahora qué"
      - "ayúdeme a saber en qué paso voy"
      - "qué sigue después de la carta"

  - intent: PPP_requisitos_etapa
    descripcion: Documentos que se necesitan en una etapa específica
    entidades: [etapa]
    ficha_relacionada: PPP_E01 a PPP_E04 según etapa
    si_falta_entidad: "¿De qué etapa necesita los requisitos? 1) Carta de presentación, 2) Plan de PPP, 3) Ejecución o 4) Informe final."
    ejemplos:
      - "qué documentos necesito para la carta de presentación"
      - "requisitos para aprobar el plan de prácticas"
      - "qué piden para el informe final de ppp"
      - "qué tengo que adjuntar en el expediente final"
      - "qué documentos van con el plan"
      - "requisitos de la etapa 2"
      - "qué necesito presentar"
      - "qué papeles piden para las prácticas"
      - "qué documentos pide la facultad para la carta"
      - "qué debo enviar para el informe final"
      - "requisitos para sacar la carta de presentación"
      - "lista de documentos del expediente de prácticas"
      - "qué necesito para la etapa 4"
      - "qué documentos me tiene que dar la empresa al terminar"

@if (usado()) {
  <section
    class="ventana"
    [class.visible]="abierto()"
    role="dialog"
    aria-label="Asistente Académico"
    [attr.aria-hidden]="!abierto()"
    (keydown)="alPresionarTecla($event)"
  >
    <udh-chat-panel>
      <header cabecera>
        <div class="marca" aria-hidden="true">UDH</div>
        <div class="titulos">
          <strong>{{ titulo() }}</strong>
          <span>{{ subtitulo() }}</span>
        </div>
        <button type="button" class="cerrar" (click)="cerrar()" aria-label="Cerrar el asistente">
          <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true">
            <path
              fill="currentColor"
              d="M6.4 5 5 6.4 10.6 12 5 17.6 6.4 19l5.6-5.6 5.6 5.6 1.4-1.4-5.6-5.6L19 6.4 17.6 5 12 10.6z"
            />
          </svg>
        </button>
      </header>
    </udh-chat-panel>
  </section>
}

@if (!abierto()) {
  <button
    type="button"
    class="lanzador"
    (click)="abrir()"
    aria-label="Abrir el Asistente Académico"
  >
    <svg viewBox="0 0 24 24" width="26" height="26" aria-hidden="true">
      <path
        fill="currentColor"
        d="M4 4h16a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H8l-4 4V6a2 2 0 0 1 2-2zm3 6v2h2v-2zm4 0v2h2v-2zm4 0v2h2v-2z"
      />
    </svg>
    <span>¿Consultas?</span>
  </button>
}

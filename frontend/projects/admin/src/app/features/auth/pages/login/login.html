<div class="fondo">
  <form class="tarjeta" (submit)="ingresar($event)" novalidate>
    <div class="marca">
      <udh-marca [alto]="48" />
    </div>
    <div class="titulo">
      <h1>Panel del Asistente Académico</h1>
      <p class="tenue">Programa Académico de Ingeniería de Sistemas e Informática</p>
    </div>

    <label class="campo">
      <span>Usuario</span>
      <input type="text" name="username" autocomplete="username" required autofocus />
    </label>
    <label class="campo">
      <span>Contraseña</span>
      <input type="password" name="password" autocomplete="current-password" required />
    </label>

    @if (error()) {
      <p class="aviso peligro" role="alert">{{ error() }}</p>
    }

    <button class="boton" type="submit" [disabled]="enviando()">
      {{ enviando() ? 'Ingresando…' : 'Ingresar' }}
    </button>
    <p class="tenue nota">
      Las cuentas las crea el Centro de Cómputo. Tras cinco intentos fallidos la cuenta se bloquea
      durante quince minutos.
    </p>
  </form>
</div>

version: '1.0'
alcance: Diseño y base de conocimiento del integrante F; no implementación de un chatbot funcional.
fuentes:
- Requisitos_para_Convalidacion_Interna.md
- Requisitos_para_Convalidacion_Externa.md
vigencia: pendiente de validación institucional
politica_contexto:
  regla_tipo: Exigir tipo cuando cambie la respuesta; permitir comparaciones explícitas con ambos tipos.
  regla_fase: Exigir fase solo para navegación o consulta ambigua. No preguntar fase si documento e intent
    la determinan.
  regla_externo: Para orientación personalizada, preguntar origen y destino si no están explícitos. Aclarar
    que el alcance oficial del documento externo está pendiente; no prometer su aplicabilidad. Se permite explicar
    lo que dice el documento con esa salvedad.
  fallos: Contador de fallos consecutivos inicia en 0. Cada entrada no comprendida o aclaración inválida suma
    1. Con 2, ejecutar GEN_derivar_humano sin tercera pregunta. Respuesta interpretada y entidades indispensables
    resueltas reinician a 0. Cambiar de tema no reinicia un fallo si la entrada sigue sin comprenderse.
  seguimiento: Sí avanza solo si existe oferta de siguiente fase y fase activa. Sí aislado sin contexto requiere
    aclaración. No ante la oferta cierra. Una pregunta directa tiene prioridad sobre la navegación secuencial.
  datos_usuario: Los estados, instituciones y dirección se guardan como mencionados_por_usuario; no como confirmación
    institucional.
  sin_integraciones: No autenticar, cobrar, registrar, aprobar ni consultar expedientes; los archivos solo
    diseñan respuestas.
  cambio_proceso: Si el usuario cambia de interno a externo o viceversa, limpiar fase activa y confirmar contexto
    nuevo.
  enrutamiento: Costos/plazos explícitos tienen prioridad sobre el intent del documento; entrega/lugar sobre
    requisitos; registro sobre pasos; siguiente fase sobre pasos con contexto; destino sobre evaluación si
    se menciona otra universidad; diferencia explícita sobre tipo. Solicitud explícita de humano tiene prioridad
    máxima.
acciones_conversacionales:
  TRA_ACC_identificar_tipo: Preguntar interno o externo; no consultar ficha hasta resolver la ambigüedad necesaria.
  TRA_ACC_derivar: Usar TRA_P_HUMANO. No enviar mensajes ni afirmar transferencia efectiva; canal oficial pendiente.
  TRA_ACC_desconocido: Usar TRA_P_NO_RECONOCIDA y regla de dos fallos.
  TRA_ACC_bienvenida: Usar TRA_P_BIENVENIDA.
  TRA_ACC_cierre: Usar TRA_P_CIERRE.
entidades:
  tipo_traslado:
    descripcion: Procedimiento explícito del usuario.
    valores_admitidos:
    - interno
    - externo
    sinonimos:
      interno:
      - traslado interno
      - convalidación interna
      externo:
      - traslado externo
      - convalidación externa
    criterio_extraccion: No inferir por cambiar de carrera o de universidad. Si se nombran ambos para comparar,
      mantener el alcance comparativo sin seleccionar uno. El cambio de tipo invalida la fase anterior.
    ejemplos:
    - texto: traslado interno
      valor: interno
    - texto: mi traslado externo
      valor: externo
    - texto: convalidacion interna
      valor: interno
    - texto: convalidación externa
      valor: externo
    - texto: interno por favor
      valor: interno
    - texto: externo nomás
      valor: externo
    - texto: es de traslado interno
      valor: interno
    - texto: consulto el proceso externo
      valor: externo
    - texto: para interno
      valor: interno
    - texto: sobre externo
      valor: externo
  fase:
    descripcion: Etapa explícita o etapa activa en el diálogo.
    valores_admitidos:
    - 1
    - 2
    - 3
    - 4
    - 5
    - 6
    - 7
    sinonimos:
      '1':
      - primera
      - certificado
      '2':
      - segunda
      - constancia
      '3':
      - tercera
      - sílabos
      '4':
      - cuarta
      - presentación documental
      '5':
      - quinta
      - registro
      '6':
      - sexta
      - evaluación
      '7':
      - séptima
      - cierre del proceso
    criterio_extraccion: Resolver tras conocer tipo_traslado. Resolución corresponde a INT 7 o EXT 6; universidad
      de destino a EXT 7. No convertir una etapa activa en evidencia de que el estudiante la completó.
    ejemplos:
    - texto: fase uno
      valor: 1
    - texto: etapa 2
      valor: 2
    - texto: la tercera
      valor: 3
    - texto: cuarta fase
      valor: 4
    - texto: fase cinco
      valor: 5
    - texto: sexta etapa
      valor: 6
    - texto: fase siete
      valor: 7
    - texto: primero mi certificado
      valor: 1
    - texto: obtención de constancia
      valor: 2
    - texto: registro de convalidación
      valor: 5
  documento:
    descripcion: Documento consultado.
    valores_admitidos:
    - certificado_estudios
    - constancia_ingreso
    - silabo
    - resolucion
    sinonimos:
      certificado_estudios:
      - certificado
      - certificado de estudios
      constancia_ingreso:
      - constancia de ingreso
      silabo:
      - sílabo
      - silabos
      - sílabos
      resolucion:
      - resolución de cursos convalidados
      - resolucion
    criterio_extraccion: Aceptar plural y omisión de tildes. Constancia sin especificación exige aclarar si
      es de ingreso. Original/autenticado son menciones que se verifican contra la ficha, no nuevos requisitos.
    ejemplos:
    - texto: mi certificado de estudios
      valor: certificado_estudios
    - texto: certificado
      valor: certificado_estudios
    - texto: sacar el certificado
      valor: certificado_estudios
    - texto: constancia de ingreso
      valor: constancia_ingreso
    - texto: mi constancia de ingreso
      valor: constancia_ingreso
    - texto: sílabos
      valor: silabo
    - texto: silabo del curso
      valor: silabo
    - texto: silabos firmados
      valor: silabo
    - texto: resolución de cursos convalidados
      valor: resolucion
    - texto: mi resolucion
      valor: resolucion
  concepto_pago:
    descripcion: Concepto tarifario; no equivale a medio de pago.
    valores_admitidos:
    - certificado_estudios
    - derecho_certificado
    - silabo
    - solicitud_convalidacion
    sinonimos:
      certificado_estudios:
      - costo del certificado
      derecho_certificado:
      - derecho de trámite del certificado
      silabo:
      - pago de sílabos
      solicitud_convalidacion:
      - derecho de convalidación
      - solicitud interna
      - solicitud externa
    criterio_extraccion: 'S/ 5 aislado no identifica un concepto: puede ser derecho del certificado o solicitud
      de convalidación. Preguntar antes de asignar. No inventar medio de pago.'
    ejemplos:
    - texto: precio del certificado
      valor: certificado_estudios
    - texto: costo por ciclo del certificado
      valor: certificado_estudios
    - texto: derecho de trámite del certificado
      valor: derecho_certificado
    - texto: trámite del certificado
      valor: derecho_certificado
    - texto: pago por sílabo
      valor: silabo
    - texto: precio de los silabos
      valor: silabo
    - texto: costo de un sílabo
      valor: silabo
    - texto: pago de solicitud de convalidación
      valor: solicitud_convalidacion
    - texto: solicitud interna de convalidación
      valor: solicitud_convalidacion
    - texto: derecho de convalidación externa
      valor: solicitud_convalidacion
  dependencia:
    descripcion: Órgano o canal mencionado en la conversación.
    valores_admitidos:
    - oficina_admision
    - secretaria_coordinacion
    - coordinacion_academica
    - dependencia_silabos_no_precisada
    - universidad_destino
    sinonimos:
      oficina_admision:
      - Admisión
      secretaria_coordinacion:
      - Secretaría de Coordinación Académica
      coordinacion_academica:
      - Coordinación Académica
      dependencia_silabos_no_precisada:
      - dependencia de sílabos
      universidad_destino:
      - universidad de destino
    criterio_extraccion: Secretaría y Coordinación son receptora y evaluadora distintas. El nombre genérico
      dependencia de sílabos no confirma una oficina concreta.
    ejemplos:
    - texto: Oficina de Admisión
      valor: oficina_admision
    - texto: Admisión
      valor: oficina_admision
    - texto: oficina de admision
      valor: oficina_admision
    - texto: Secretaría de Coordinación Académica
      valor: secretaria_coordinacion
    - texto: secretaria de coordinacion
      valor: secretaria_coordinacion
    - texto: Coordinación Académica
      valor: coordinacion_academica
    - texto: coordinacion academica
      valor: coordinacion_academica
    - texto: dependencia de sílabos
      valor: dependencia_silabos_no_precisada
    - texto: universidad de destino
      valor: universidad_destino
    - texto: mi universidad de destino
      valor: universidad_destino
  estado_tramite:
    descripcion: Estado autodeclarado; no catálogo oficial del sistema.
    valores_admitidos:
    - por_iniciar
    - documentos_reunidos
    - documentos_presentados
    - solicitud_registrada
    - en_evaluacion
    - observado
    - rechazado
    - resolucion_recibida
    - desconocido
    sinonimos:
      por_iniciar:
      - no empecé
      documentos_reunidos:
      - ya tengo los documentos
      documentos_presentados:
      - ya entregué
      solicitud_registrada:
      - ya registré
      en_evaluacion:
      - están revisando
      observado:
      - observado
      rechazado:
      - rechazado
      resolucion_recibida:
      - recibí la resolución
      desconocido:
      - no sé el estado
    criterio_extraccion: Guardar como estado_mencionado_por_usuario. Nunca afirmar consulta al expediente o
      estado verificado. Observado y rechazado no tienen procedimiento de subsanación documentado.
    ejemplos:
    - texto: no empecé
      valor: por_iniciar
    - texto: tengo los documentos
      valor: documentos_reunidos
    - texto: ya entregué los requisitos
      valor: documentos_presentados
    - texto: registré mi solicitud
      valor: solicitud_registrada
    - texto: me dicen que está en evaluación
      valor: en_evaluacion
    - texto: mi trámite está observado
      valor: observado
    - texto: lo rechazaron
      valor: rechazado
    - texto: recibí la resolución
      valor: resolucion_recibida
    - texto: no sé el estado
      valor: desconocido
    - texto: todavía no inicio
      valor: por_iniciar
  universidad_destino:
    descripcion: Nombre libre de institución dicho por el usuario.
    valores_admitidos:
    - texto_libre_no_vacio
    sinonimos: {}
    criterio_extraccion: Extraer el nombre después de voy a, destino o universidad de destino; conservar el
      texto original. Los ejemplos no son destinos autorizados ni convenios confirmados.
    ejemplos:
    - texto: mi universidad de destino es Universidad Ejemplo A
      valor: Universidad Ejemplo A
    - texto: mi universidad de destino es Universidad Ejemplo B
      valor: Universidad Ejemplo B
    - texto: mi universidad de destino es Universidad Ejemplo C
      valor: Universidad Ejemplo C
    - texto: mi universidad de destino es Universidad Ejemplo D
      valor: Universidad Ejemplo D
    - texto: mi universidad de destino es Universidad Ejemplo E
      valor: Universidad Ejemplo E
    - texto: mi universidad de destino es Universidad Ejemplo F
      valor: Universidad Ejemplo F
    - texto: mi universidad de destino es Universidad Ejemplo G
      valor: Universidad Ejemplo G
    - texto: mi universidad de destino es Universidad Ejemplo H
      valor: Universidad Ejemplo H
    - texto: mi universidad de destino es Universidad Ejemplo I
      valor: Universidad Ejemplo I
    - texto: mi universidad de destino es Universidad Ejemplo J
      valor: Universidad Ejemplo J
  direccion_traslado:
    descripcion: Sentido indicado por el usuario, separado del alcance oficial del documento.
    valores_admitidos:
    - ingreso_a_udh
    - salida_de_udh
    - no_confirmada
    sinonimos:
      ingreso_a_udh:
      - de otra universidad a UDH
      salida_de_udh:
      - de UDH a otra universidad
      no_confirmada:
      - no sé el sentido
    criterio_extraccion: Extraer origen y destino explícitos; no inferir ingreso/salida por externo. Incluso
      si el usuario lo aclara, el procedimiento oficial aplicable continúa pendiente hasta validación de Coordinación.
    ejemplos:
    - texto: vengo de otra universidad a UDH
      valor: ingreso_a_udh
    - texto: quiero ingresar a UDH desde otra universidad
      valor: ingreso_a_udh
    - texto: mi destino es UDH y vengo de otra institución

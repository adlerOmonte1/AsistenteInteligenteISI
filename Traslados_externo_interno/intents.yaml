resolucion_fichas:
  convencion: Las listas son candidatos existentes, no una autorización para mezclar procedimientos. Filtrar
    por tipo, intent, concepto y fase. NO_APLICA es solo la convención del golden set para aclaración o acción
    sin ficha.
  por_concepto:
    certificado_estudios:
    - TRA_INT_F01
    - TRA_EXT_F01
    derecho_certificado:
    - TRA_INT_F01
    - TRA_EXT_F01
    silabo:
    - TRA_INT_F03
    - TRA_EXT_F03
    solicitud_convalidacion:
    - TRA_INT_F05
    - TRA_EXT_F05
  excepcion_costo_constancia: TRA_costo con documento constancia_ingreso usa F02 del tipo activo y responde
    costo no indicado; no inventar cero.
  por_documento:
    certificado_estudios:
    - TRA_INT_F01
    - TRA_EXT_F01
    constancia_ingreso:
    - TRA_INT_F02
    - TRA_EXT_F02
    silabo:
    - TRA_INT_F03
    - TRA_EXT_F03
    resolucion:
    - TRA_INT_F07
    - TRA_EXT_F06
  original_o_copia: TRA_certificado o TRA_requisitos sobre entrega del original recupera F04 del tipo activo.
  plazo: F02 para constancia; F06 para evaluación. Para otra etapa recuperar su ficha e indicar no indicado
    si datos.plazo es nulo. No sumar plazos parciales para dar una duración total.
  siguiente_fase: Leer siguiente_fase de la ficha activa; el golden set refiere la ficha de destino. Si es
    null, cerrar el procedimiento documentado.
  estado: Recuperar F05 para contextualizar, pero reconocer falta de mecanismo de seguimiento y orientar a
    Coordinación sin afirmar acceso a expedientes.
  diferencia: Comparar solo las referencias listadas para TRA_diferencia; explicitar el pendiente de dirección
    externa.
  destino: No imponer tipo externo si el usuario había confirmado interno; pedir aclaración ante esa contradicción.

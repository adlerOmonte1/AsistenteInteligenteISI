resolucion_fichas:
  regla: Los listados ficha_relacionada son candidatos reales, no autorización para mezclar fases. Resolver la fase
    por contexto antes de leer datos.
  prerrequisito: TSP_F00; etapa=0, fase sin valor administrativo.
  siguiente: Seguir siguiente_fase y conservar condiciones_continuidad. El Golden Set usa ficha de respuesta, no
    un avance de expediente.
  observaciones: 'F02 y F04: máximo 2 meses para subsanar. F08: atender requisitos/observaciones de Repositorio,
    pero sin plazo de subsanación especificado. Para otra fase responder no indicado; no trasladar el plazo de dos
    meses.'
  referencias_golden: Si una aclaración tiene dos fichas candidatas, separarlas con | dentro de ficha_esperada,
    sin agregar columnas ni IDs ficticios.
  derivacion: GEN_derivar_humano es una dependencia externa; no debe existir en la lista local intents.

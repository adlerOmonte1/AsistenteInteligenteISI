version: '1.0'
proceso: titulo_tsp
fuente: TrabajoSuficiencia.md
vigencia: no indicada; pendiente de confirmación institucional
dependencias_externas:
- intent_referenciado: GEN_derivar_humano
  modulo_propietario: 'integrante F: traslados_generales'
  contrato: Solo referencia de integración; no se define ni entrena este intent en TSP.
politica_contexto:
  modalidad: Este módulo atiende exclusivamente TSP. Si se identifica otra modalidad, usar TSP_fuera_alcance; no
    recuperar fichas de tesis o traslados.
  fase: Resolver primero mención explícita inequívoca; después documento/acción inequívocos; después fase activa
    del diálogo. Si hay ambigüedad, preguntar. Fase solo contiene 1 a 8; etapa admite 0 como prerrequisito.
  entidad_faltante: Conservar intent_pendiente y entidades resueltas. Una respuesta como la 6 completa el intent
    de costo anterior y selecciona TSP_F06. No clasificar la aclaración aislada como una consulta nueva.
  ambiguedades:
    jurados:
    - 2
    - 4
    informe final sin acción:
    - 4
    - 5
    - 6
    - 7
    resolución de aprobación sin contexto:
    - 3
    - 5
    plazo fase 2:
    - evaluación
    - subsanación
    fase 8 plazo:
    - Consejo
    - entrega
  prioridad: Otra modalidad tiene prioridad máxima. Costos y formatos explícitos prevalecen sobre tema general.
    Observaciones y ejecución conservan intents especializados aunque incluyan duración. Fecha de sustentación se
    resuelve a F07, apto a F06. Una pregunta de documentos específicos prevalece sobre TSP_sustentacion.
  fallos: Iniciar contador en 0. Sumar solo por mensaje incomprensible o respuesta inválida a una aclaración. Pedir
    por primera vez fase o tipo faltante no cuenta como fallo. A los 2 fallos consecutivos emitir la referencia
    GEN_derivar_humano; no hacer una tercera pregunta. Tras comprensión con contexto suficiente, reiniciar a 0.
  continuidad: Guardar fase_activa, etapa_activa, intent_pendiente y oferta_siguiente. Cuánto cuesta después de
    requisitos F05 conserva fase=5. Pregunta directa sobre otra fase cambia el contexto sin obligar a recorrer etapas.
  si_no: Sí avanza solo con oferta_siguiente activa; sin ella, pedir precisión. No ante la oferta cierra. Un cambio
    de tema válido sustituye la consulta anterior.
  condiciones: Al pasar F03 a F04 explicar la ejecución de 2 a 6 meses, salvo que el usuario diga explícitamente
    haberla concluido; nunca verificarla automáticamente. Al pasar F07 a F08 explicar la sustentación previa; no
    inventar acta o condición de aprobación no descrita.
  datos: Estados, pagos realizados y experiencia son declaraciones del usuario. No registran ni validan expedientes.
    La falta de información institucional no es fallo de comprensión.
  vigencia: Todos los hechos se atribuyen al documento; no afirmar vigencia oficial. Monto null es no indicado;
    cero es pago documentado de F01/F02. No crear plazos de atención a partir de experiencia o duración de ejecución.
  documentos_frente_requisitos: Una petición de lista completa de documentos necesarios se clasifica como requisitos.
    Una consulta centrada en formato Word/PDF o en identificar un documento concreto se clasifica como documentos.
    Mantener esta distinción en el Golden Set.
acciones_conversacionales:
  TSP_ACC_fuera_alcance: Usar TSP_P16; aclarar que el módulo corresponde a TSP. La selección de otro módulo depende
    de la arquitectura global y no se implementa aquí.
  TSP_ACC_desconocido: Pedir reformulación una vez; aplicar política de dos fallos.
  TSP_ACC_cierre: Usar TSP_P14.
  TSP_ACC_referencia_humana: Solo solicitar al orquestador la referencia GEN_derivar_humano. No copiar su definición
    ni afirmar transferencia automática.
entidades:
  fase:
    descripcion: Fase administrativa 1 a 8; el prerrequisito se resuelve en etapa=0.
    valores_admitidos:
    - 1
    - 2
    - 3
    - 4
    - 5
    - 6
    - 7
    - 8
    sinonimos:
      '1':
      - primera fase
      - fase del asesor
      '2':
      - segunda fase
      - designación de jurados del trabajo
      '3':
      - tercera fase
      - aprobación del trabajo
      '4':
      - jurados para el informe final
      '5':
      - aprobación del informe final
      '6':
      - apto para sustentación
      '7':
      - programación de sustentación
      '8':
      - optar título
    criterio_extraccion: Aceptar números y ordinales. Jurados aislado genera candidatos 2 y 4; informe final sin
      acción genera candidatos 4, 5, 6 y 7. No resolver ambiguos por coincidencia parcial. Fase 0 se aclara como
      prerrequisito y se guarda en etapa=0, sin crear una fase administrativa.
    ejemplos:
    - texto: fase 1
      valor: 1
    - texto: fase 2
      valor: 2
    - texto: fase 3
      valor: 3
    - texto: fase 4
      valor: 4
    - texto: fase 5
      valor: 5
    - texto: fase 6
      valor: 6
    - texto: fase 7
      valor: 7
    - texto: fase 8
      valor: 8
    - texto: fase del asesor
      valor: 1
    - texto: apto para sustentación
      valor: 6
  etapa:
    descripcion: 'Unidad de conocimiento consultada: prerrequisito o fase.'
    valores_admitidos:
    - 0
    - 1
    - 2
    - 3
    - 4
    - 5
    - 6
    - 7
    - 8
    sinonimos:
      '0':
      - prerrequisito
      - experiencia previa
      - acreditar experiencia
      '1':
      - docente asesor
      '2':
      - jurados del trabajo
      '3':
      - aprobar trabajo
      '4':
      - jurados de informe final
      '5':
      - aprobar informe final
      '6':
      - declarar apto
      '7':
      - fecha y hora
      '8':
      - optar título
    criterio_extraccion: Permite seleccionar TSP_F00 por experiencia profesional. Para etapas 1 a 8 mantener coherencia
      con fase. Cuando ambas entidades estén explícitas y sean contradictorias, pedir aclaración.
    ejemplos:
    - texto: prerrequisito
      valor: 0
    - texto: experiencia profesional previa
      valor: 0
    - texto: etapa 1
      valor: 1
    - texto: etapa 2
      valor: 2
    - texto: etapa 3
      valor: 3
    - texto: etapa 4
      valor: 4
    - texto: etapa 5
      valor: 5
    - texto: etapa 6
      valor: 6
    - texto: etapa 7
      valor: 7
    - texto: etapa 8
      valor: 8
  tipo_consulta:
    descripcion: Propósito comunicativo extraído de la pregunta.
    valores_admitidos:
    - requisitos
    - pasos
    - costo
    - plazo
    - documentos
    - resolucion
    - siguiente
    - experiencia
    - observaciones
    - ejecucion
    - sustentacion
    - titulo
    - repositorio
    - seguimiento
    - contacto
    - fuera_alcance
    sinonimos:
      costo:
      - cuánto cuesta
      - cuanto pago
      plazo:
      - cuánto demora
      - cuánto tiempo
      requisitos:
      - qué necesito
      seguimiento:
      - cómo va mi trámite
    criterio_extraccion: El propósito específico prevalece sobre el nombre de un documento. Cuánto cuesta el apto
      es costo con fase=6; no TSP_sustentacion. La clasificación de observaciones conserva intención propia para
      plazos de subsanación.
    ejemplos:
    - texto: qué necesito
      valor: requisitos
    - texto: cómo lo hago paso a paso
      valor: pasos
    - texto: cuánto debo pagar
      valor: costo
    - texto: cuánto demora
      valor: plazo
    - texto: en Word o PDF
      valor: documentos
    - texto: quién emite la resolución
      valor: resolucion
    - texto: qué sigue después
      valor: siguiente
    - texto: cuántos años debo acreditar
      valor: experiencia
    - texto: quiero subsanar observaciones
      valor: observaciones
    - texto: cómo consulto el estado
      valor: seguimiento
  documento:
    descripcion: Documento y formato mencionados por el bachiller.
    valores_admitidos:
    - carta_aceptacion
    - constancia_conducta
    - informe_conformidad_asesor
    - resolucion_asesor
    - trabajo_word
    - trabajo_pdf
    - originalidad
    - informe_final_word
    - informe_final_pdf
    - aprobacion_jurados
    - grado_bachiller
    - dni
    - certificado_judicial
    - boleta_pago
    - resolucion_aprobacion_informe_pdf
    - constancia_repositorio
    - fotografias
    sinonimos:
      trabajo_word:
      - trabajo de investigación en Word
      trabajo_pdf:
      - trabajo en PDF
      informe_final_word:
      - informe final en Word
      informe_final_pdf:
      - informe final en PDF
      originalidad:
      - constancia de originalidad
      certificado_judicial:
      - certificado judicial
    criterio_extraccion: Conservar la distinción entre trabajo e informe final y entre Word y PDF. No sustituir
      certificado judicial por otro documento. Resolución de aprobación sin más detalle no se completa con un nombre
      supuesto.
    ejemplos:
    - texto: carta de aceptación
      valor: carta_aceptacion
    - texto: constancia del curso de Conducta Responsable de Investigación
      valor: constancia_conducta
    - texto: informe de conformidad del asesor
      valor: informe_conformidad_asesor
    - texto: resolución del asesor
      valor: resolucion_asesor
    - texto: trabajo en Word
      valor: trabajo_word
    - texto: trabajo en PDF
      valor: trabajo_pdf
    - texto: informe final en Word
      valor: informe_final_word
    - texto: informe final en PDF
      valor: informe_final_pdf
    - texto: certificado judicial
      valor: certificado_judicial
    - texto: Constancia de Inscripción al Repositorio Institucional
      valor: constancia_repositorio
  pago:
    descripcion: Importe dicho por el usuario; no acredita pago ni vigencia.
    valores_admitidos:
    - monto_decimal_pen
    - no_indicado
    sinonimos:
      monto_decimal_pen:
      - soles
      - S/
      no_indicado:
      - sin información de monto
    criterio_extraccion: 'Normalizar S/ 3,212.00 como 3212.00 PEN, pero verificar siempre en la ficha. Un monto
      no identifica por sí solo una fase: S/ 5 se repite y S/ 0 aparece en F01 y F02. No pedir datos de tarjeta
      ni comprobar pagos.'
    ejemplos:
    - texto: S/ 0.00
      valor: '0.00'
    - texto: cero soles
      valor: '0.00'
    - texto: S/ 5.00
      valor: '5.00'
    - texto: cinco soles
      valor: '5.00'
    - texto: S/ 3,212.00
      valor: '3212.00'
    - texto: 3212 soles
      valor: '3212.00'
    - texto: S/ 10.00
      valor: '10.00'
    - texto: pagué 5 soles
      valor: '5.00'
    - texto: me dijeron 3212 soles
      valor: '3212.00'
    - texto: sin información de monto
      valor: no_indicado
  plazo:
    descripcion: Duración o periodicidad mencionada, con su alcance.
    valores_admitidos:
    - duracion_con_unidad_y_calificador
    - periodicidad
    - no_indicado
    sinonimos:
      duracion_con_unidad_y_calificador:
      - días
      - meses
      - años
      periodicidad:
      - primera semana de cada mes
      no_indicado:
      - no sé cuánto demora
    criterio_extraccion: Guardar valor, unidad, mínimo/máximo/aproximado y ámbito si aparecen. Dos años de experiencia
      no es un plazo de atención. Quince días no se transforman en hábiles. Lo dicho por el usuario se verifica
      contra la ficha.
    ejemplos:
    - texto: máximo 15 días
      valor:
        valor: 15
        unidad: días
        tipo: máximo
    - texto: máximo dos meses
      valor:
        valor: 2
        unidad: meses
        tipo: máximo
    - texto: mínimo 2 meses
      valor:
        valor: 2
        unidad: meses
        tipo: mínimo
    - texto: máximo 6 meses
      valor:
        valor: 6
        unidad: meses
        tipo: máximo
    - texto: aproximadamente 2 meses
      valor:
        valor: 2
        unidad: meses
        tipo: aproximado
    - texto: dos años de experiencia
      valor:
        valor: 2
        unidad: años
        ambito: experiencia
    - texto: primera semana de cada mes
      valor:
        periodicidad: primera semana de cada mes
    - texto: 15 dias
      valor:
        valor: 15
        unidad: días
        tipo: no especificado
    - texto: seis meses
      valor:
        valor: 6
        unidad: meses
        tipo: no especificado
    - texto: no sé cuánto demora
      valor: no_indicado
  responsable:
    descripcion: Actor u oficina mencionada; la extracción no valida un contacto.
    valores_admitidos:
    - bachiller
    - asesor
    - jurados
    - secretaria
    - plataforma
    - programa_academico
    - facultad_ingenieria
    - repositorio
    - consejo_facultad
    - coordinacion
    sinonimos:
      secretaria:
      - Secretaría del Programa Académico
      programa_academico:
      - Programa Académico
      facultad_ingenieria:
      - Facultad de Ingeniería
      repositorio:
      - Repositorio Institucional
      asesor:
      - docente asesor
      - asesor técnico
    criterio_extraccion: No intercambiar oficio del Programa con resolución de Facultad. El correo de Repositorio
      no es el correo de Secretaría. Login UDH está confirmado en la fuente para inicio F08 y seguimiento; Plataforma
      de las demás fases sigue siendo genérica.
    ejemplos:
    - texto: bachiller
      valor: bachiller
    - texto: asesor técnico
      valor: asesor
    - texto: jurados
      valor: jurados
    - texto: Secretaría del Programa Académico
      valor: secretaria
    - texto: Plataforma
      valor: plataforma
    - texto: Programa Académico
      valor: programa_academico
    - texto: Facultad de Ingeniería
      valor: facultad_ingenieria
    - texto: Repositorio Institucional
      valor: repositorio
    - texto: Consejo de Facultad
      valor: consejo_facultad
    - texto: Coordinación
      valor: coordinacion
  estado_tramite:
    descripcion: Situación autodeclarada del usuario; no catálogo oficial de estados.
    valores_admitidos:
    - por_iniciar
    - experiencia_enviada
    - asesor_designado
    - observado
    - trabajo_aprobado
    - en_ejecucion
    - informe_aprobado
    - apto
    - sustentacion_programada
    - sustentacion_realizada
    - areas_atendidas
    - desconocido
    sinonimos:
      observado:
      - me observaron
      apto:
      - ya estoy apto
      sustentacion_realizada:
      - ya sustenté
    criterio_extraccion: Conservar como mencionado_por_usuario. No afirmar que el sistema consultó un expediente.
      En ejecución y sustentación, una oferta de siguiente fase no demuestra cumplimiento administrativo.
    ejemplos:
    - texto: todavía no empiezo
      valor: por_iniciar
    - texto: envié mis contratos
      valor: experiencia_enviada
    - texto: ya tengo asesor designado
      valor: asesor_designado
    - texto: me hicieron observaciones
      valor: observado
    - texto: mi trabajo está aprobado
      valor: trabajo_aprobado
    - texto: estoy ejecutando el trabajo
      valor: en_ejecucion
    - texto: mi informe final está aprobado
      valor: informe_aprobado
    - texto: ya me declararon apto
      valor: apto
    - texto: tengo fecha de sustentación
      valor: sustentacion_programada
    - texto: ya sustenté
      valor: sustentacion_realizada

# ─────────────────── CONVALIDACIÓN DE PPP POR EXPERIENCIA LABORAL ───────────────────

- intent: CPP_condiciones
  descripcion: Quién puede convalidar la PPP por experiencia laboral (Art. 31)
  entidades: []
  ejemplos:
    - "puedo convalidar mis prácticas con mi trabajo"
    - "quién puede convalidar las PPP"
    - "cuánto tiempo de trabajo necesito para convalidar prácticas"
    - "trabajo hace un año, puedo convalidar las prácticas"
    - "desde qué ciclo puedo convalidar las prácticas"
    - "si trabajo en una empresa privada puedo convalidar"
    - "requisitos para convalidar prácticas por experiencia laboral"
    - "convalidan prácticas si soy practicante contratado"

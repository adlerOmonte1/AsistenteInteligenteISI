    - "cómo se escribe el asunto DNI foto para bachiller"
    - "mando el DNI escaneado por correo para el bachiller"
    - "qué correo es el del bachiller"
  ficha_relacionada: BAC_P03
  si_falta_entidad: "No requiere entidad. Si la consulta dice solo «a qué correo envío»: «¿El correo es para el trámite de Bachiller o para la convalidación de PPP?»"

- intent: BAC_seguimiento
  descripcion: Cómo consultar el estado del trámite de Bachiller y qué hacer con documentos recibidos

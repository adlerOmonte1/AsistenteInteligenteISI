# Intents del proceso E: Grado de Bachiller (BAC_) y Convalidación de PPP por experiencia laboral (CPP_)
# Entidades definidas en entidades.yaml. Derivación transversal: GEN_derivar_humano (integrante F).
# Formato según el contrato común, sección 3.4.

# ───────────────────────────── GRADO DE BACHILLER ─────────────────────────────

- intent: BAC_info_general
  descripcion: Visión general del trámite virtual para optar el Grado de Bachiller (pasos 1 a 6)
  entidades: []
  ejemplos:
    - "cómo saco mi bachiller"
    - "cuál es el proceso para obtener el grado de bachiller"
    - "pasos para optar el grado académico de bachiller"
    - "quiero tramitar mi bachiller, qué hago"
    - "cómo es el trámite virtual de bachiller"
    - "explícame el trámite del grado de bachiller"
    - "dónde inicio el trámite de bachiller"
    - "qué tengo que hacer para ser bachiller"
    - "ya terminé la carrera, cómo pido el bachiller"
    - "proceso de bachiller en ingeniería de sistemas"
    - "cuántos pasos tiene el trámite de bachiller"
    - "en qué plataforma se pide el bachiller"
  ficha_relacionada: BAC_P01
  si_falta_entidad: "No requiere entidad. Si la consulta dice solo «grado» o «título»: «¿Te refieres al Grado de Bachiller o al Título Profesional?»"

- intent: BAC_requisitos_paso
  descripcion: Requisitos y acciones de un paso concreto del trámite de Bachiller
  entidades: [paso_bachiller]
  ejemplos:
    - "qué necesito para el paso 2 del bachiller"
    - "qué se hace en el paso 4 del trámite de bachiller"
    - "requisitos del paso 1 de bachiller"
    - "qué sigue después de enviar mi DNI para el bachiller"
    - "qué hago en el paso de verificación de oficinas"
    - "qué pasa en el paso 5 del bachiller"
    - "en qué consiste el último paso del bachiller"
    - "qué me piden en el primer paso del bachiller"
    - "qué hace la comisión en el trámite de bachiller"
    - "requisitos de la etapa de fotos del bachiller"
    - "qué paso viene después de subir la foto"
  ficha_relacionada: BAC_P*
  si_falta_entidad: "¿De qué paso del trámite de Bachiller necesitas información? (1 plataforma, 2 fotos, 3 correo con DNI, 4 verificación de oficinas, 5 Comisión y Consejo de Facultad, 6 Consejo Universitario)"

- intent: BAC_fotos
  descripcion: Características y entrega de las fotos (digital y física) para el Bachiller
  entidades: [tipo_foto]
  ejemplos:
    - "cómo debe ser la foto para el bachiller"
    - "qué medida tienen las fotos del bachiller"
    - "cuántas fotos necesito para el bachiller"
    - "la foto del bachiller es con fondo blanco"
    - "dónde entrego las fotos físicas del bachiller"
    - "tengo que ir con terno para la foto de bachiller"
    - "fotos 4x5 para bachiller"
    - "dónde subo la foto para el grado de bachiller"
    - "la foto es tamaño pasaporte o carnet"
    - "las fotos físicas se entregan o se mandan por correo"
    - "requisitos de foto para el trámite de bachiller"
  ficha_relacionada: BAC_P02
  si_falta_entidad: "¿Te refieres a la foto digital que se sube al sistema o a las fotos físicas que se entregan en la oficina? (Si no responde, se muestran ambas.)"

- intent: BAC_envio_correo
  descripcion: Correo, asunto y adjuntos para enviar el DNI y la foto del Bachiller
  entidades: []
  ejemplos:
    - "a qué correo mando mi DNI para el bachiller"
    - "qué asunto pongo en el correo del bachiller"
    - "dónde envío el DNI y la foto del bachiller"

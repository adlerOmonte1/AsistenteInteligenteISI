# Intents del proceso: Convalidación de PPP por experiencia laboral (prefijo CPP_)
# Fuente de todas las respuestas: fichas/CPP_F01 a CPP_F05

- intent: CPP_condiciones
  descripcion: Quién puede convalidar la PPP por experiencia laboral (ciclo mínimo, tipo de trabajo, tiempo)
  entidades: []
  ejemplos:
    - "quién puede convalidar las prácticas preprofesionales"
    - "puedo convalidar mi ppp con mi trabajo"
    - "cuántos meses de trabajo necesito para convalidar"
    - "qué ciclo debo haber terminado para convalidar la ppp"
    - "mi trabajo tiene que ser de mi carrera para convalidar"
    - "sirve trabajar en una empresa privada para convalidar"
    - "convalidación de ppp por experiencia laboral condiciones"
    - "cuál es el tiempo mínimo de trabajo para convalidar"
    - "necesito ser nombrado o contratado para convalidar"
    - "en qué casos se convalida la práctica preprofesional"
    - "puedo convalidar si trabajé en una entidad pública"
    - "es obligatorio hacer prácticas o puedo convalidarlas"
  ficha_relacionada: CPP_F01

- intent: CPP_requisitos
  descripcion: Documentos que se deben presentar para solicitar la convalidación
  entidades: []
  ejemplos:
    - "qué documentos necesito para convalidar mi ppp"
    - "requisitos para la convalidación de prácticas"
    - "qué debo presentar para convalidar las prácticas preprofesionales"
    - "qué es el anexo 08"
    - "qué es el anexo 09"
    - "necesito boletas de pago para convalidar"
    - "piden constancia de trabajo para convalidar"
    - "quién firma la ficha de evaluación"
    - "qué lleva el informe técnico de convalidación"
    - "lista de documentos de convalidación de ppp"
    - "tengo que presentar mi contrato original"
    - "qué papeles piden para convalidar por trabajo"
  ficha_relacionada: CPP_F02

- intent: CPP_pasos_proceso
  descripcion: Pasos generales del trámite y qué hace cada área
  entidades: [etapa]
  ejemplos:
    - "cómo es el proceso de convalidación de ppp"
    - "cuáles son los pasos para convalidar mis prácticas"
    - "qué hago primero para convalidar la ppp"
    - "cómo inicio el trámite de convalidación"
    - "qué área revisa mi expediente de convalidación"
    - "quién evalúa mi convalidación de ppp"
    - "qué hace la comisión de ppp"
    - "qué hace el programa académico en la convalidación"
    - "qué pasa después de enviar mis documentos"
    - "en qué etapa está el trámite de convalidación"
    - "tengo que sustentar para convalidar"
    - "cuántas etapas tiene la convalidación"
  ficha_relacionada: [CPP_F02, CPP_F03, CPP_F04, CPP_F05]
  si_falta_entidad: "¿Quieres el resumen del proceso completo o de una etapa específica? (1 solicitud, 2 verificación, 3 comisión, 4 resolución)"

